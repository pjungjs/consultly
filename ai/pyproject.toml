[project]
name = "ai"
version = "0.1.0"
description = "Consultly AI service: reads PDF briefs and writes consultant prep sheets"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
